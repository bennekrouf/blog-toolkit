name: Release

on:
  push:
    tags:
      - 'v*'

  # Manual trigger from the GitHub Actions UI:
  # Actions → Release → Run workflow → enter version (e.g. 0.2.0)
  # Leave empty to auto-bump the patch version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0) — empty = auto-bump patch'
        required: false
        default: ''
      bump:
        description: 'Bump type if version is empty'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  # ── When triggered via workflow_dispatch: bump Cargo.toml and tag ──────────
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version and tag
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_TYPE: ${{ inputs.bump }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ -n "$VERSION_INPUT" ]]; then
            NEW="$VERSION_INPUT"
          elif [[ "$BUMP_TYPE" == "major" ]]; then
            NEW="$((MAJOR+1)).0.0"
          elif [[ "$BUMP_TYPE" == "minor" ]]; then
            NEW="$MAJOR.$((MINOR+1)).0"
          else
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
          fi

          TAG="v$NEW"
          echo "Bumping $CURRENT → $NEW (tag: $TAG)"
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" Cargo.toml
          git add Cargo.toml
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-mac:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-arm64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package tar.gz
        run: |
          NAME="blog-toolkit-macos-arm64"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          cp target/aarch64-apple-darwin/release/blog-toolkit "$DIST/"
          cp scripts/setup-mac.sh "$DIST/"
          cp README.md "$DIST/"
          chmod +x "$DIST/setup-mac.sh"
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "Package: $NAME.tar.gz ($(du -sh "$NAME.tar.gz" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: blog-toolkit-macos-arm64
          path: |
            blog-toolkit-macos-arm64.tar.gz
            blog-toolkit-macos-arm64.tar.gz.sha256

  # ── Linux x86_64 ───────────────────────────────────────────────────────────
  build-linux:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-x86_64-${{ hashFiles('Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package tar.gz
        run: |
          NAME="blog-toolkit-linux-x86_64"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          cp target/x86_64-unknown-linux-gnu/release/blog-toolkit "$DIST/"
          cp scripts/setup-linux.sh "$DIST/"
          cp README.md "$DIST/"
          chmod +x "$DIST/setup-linux.sh" "$DIST/blog-toolkit"
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: blog-toolkit-linux-x86_64
          path: |
            blog-toolkit-linux-x86_64.tar.gz
            blog-toolkit-linux-x86_64.tar.gz.sha256

  # ── Windows x64 ────────────────────────────────────────────────────────────
  build-windows:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Copy WebView2Loader.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem "target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName "target\release\WebView2Loader.dll" -Force
            Write-Host "Copied WebView2Loader.dll"
          } else {
            Write-Warning "WebView2Loader.dll not found — installer will skip it"
          }

      # ── Windows code signing ───────────────────────────────────────────────
      # Both the application binary and the installer get signed, in that
      # order: Inno Setup embeds whatever .exe it finds, so signing after
      # packaging would leave an unsigned binary inside a signed installer —
      # SmartScreen and enterprise policies both object to that.
      #
      # Unconfigured repos still build; the .exe just ships unsigned and
      # SmartScreen warns on download. Set all six secrets to enable.
      - name: Check Windows signing secrets
        id: winsign
        shell: pwsh
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TS_ENDPOINT:         ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT:          ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_CERT_PROFILE:     ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
        run: |
          $names = @('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET',
                     'TS_ENDPOINT','TS_ACCOUNT','TS_CERT_PROFILE')
          $missing = $names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing.Count -eq 0) {
            "have=true" | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "All Windows signing secrets present."
          } elseif ($missing.Count -eq $names.Count) {
            "have=false" | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "::warning::No Windows signing secrets configured — the .exe will ship unsigned and SmartScreen will warn on download."
          } else {
            Write-Host "::error::Incomplete Windows signing configuration. Missing: $($missing -join ', ')"
            Write-Host "Set all six, or none at all to skip signing."
            exit 1
          }

      - name: Sign application binary
        if: steps.winsign.outputs.have == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:     ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name:     ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found" }
          $version = "${{ needs.prepare.outputs.tag || github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $iscc /DMyAppVersion=$version installer\installer.iss

      - name: Sign installer
        if: steps.winsign.outputs.have == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:     ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name:     ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Signing rewrites the file, so the checksum has to be taken afterwards —
      # otherwise it describes a binary nobody downloads.
      - name: Checksum installer
        shell: pwsh
        run: |
          $exe = "blog-toolkit-setup.exe"
          $hash = (Get-FileHash "dist\$exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File "dist\$exe.sha256" -Encoding ASCII
          Write-Host "Installer: dist\$exe ($([math]::Round((Get-Item "dist\$exe").Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: blog-toolkit-windows
          path: |
            dist\blog-toolkit-setup.exe
            dist\blog-toolkit-setup.exe.sha256

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    needs: [build-mac, build-linux, build-windows]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Require at least one artifact
        run: |
          set -euo pipefail
          count=$(find artifacts -type f | wc -l | tr -d ' ')
          echo "Artifacts staged: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No platform artifacts were produced — nothing to release."
            exit 1
          fi

      # ── Distribution manifest ──────────────────────────────────────────────
      # latest.json stays PUBLIC and is the only file attached to the GitHub
      # Release: publishing the sha256 of each artifact lets a user verify what
      # they downloaded against a source we do not control the delivery of.
      - name: Flatten artifacts + generate latest.json
        env:
          REPO: ${{ github.repository }}
          DL_BASE: ${{ vars.DOWNLOAD_BASE_URL }}
          TAG:  ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

          VER="${TAG#v}"
          # Versioned, immutable URLs — the same paths the publish step below
          # rsyncs to. Override with the DOWNLOAD_BASE_URL repo variable if the
          # download host ever moves.
          BASE="${DL_BASE:-https://mayorana.ch/downloads/blog-toolkit}"
          BASE="${BASE%/}/$TAG"

          MAC_TGZ="blog-toolkit-macos-arm64.tar.gz"
          WIN_EXE="blog-toolkit-setup.exe"
          LINUX_TGZ="blog-toolkit-linux-x86_64.tar.gz"

          sha() { [ -n "$1" ] && [ -f "release/$1" ] && sha256sum "release/$1" | awk '{print $1}' || echo ""; }

          cat > release/latest.json <<EOF
          {
            "name": "blog-toolkit",
            "version": "$VER",
            "tag": "$TAG",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "macos":   { "tarball": { "url": "$BASE/$MAC_TGZ",   "sha256": "$(sha "$MAC_TGZ")"   } },
              "windows": { "exe_or_msi": { "url": "$BASE/$WIN_EXE", "sha256": "$(sha "$WIN_EXE")" } },
              "linux":   { "tarball": { "url": "$BASE/$LINUX_TGZ", "sha256": "$(sha "$LINUX_TGZ")" } }
            }
          }
          EOF
          cat release/latest.json

      # ── Publish the signed artifacts to mayorana.ch ────────────────────────
      # The binaries are the product and no longer ride on the public GitHub
      # Release. nginx on the VPS serves them straight off disk from
      #   /var/www/mayorana-downloads/blog-toolkit/{<tag>,latest}/
      #
      # `latest/` is synced with --delete so it always matches exactly this
      # release: when a platform fails to build, its download 404s instead of
      # quietly serving the previous version under this version's checksum.
      #
      # No mkdir over ssh: the deploy key is confined with rrsync and gets no
      # shell. rsync creates the final path component, and <root>/blog-toolkit
      # already exists on the server.
      #
      # Unset secrets = skip with a warning, so a fork or an unconfigured
      # checkout still gets a green pipeline and downloadable Actions artifacts.
      - name: Publish artifacts to mayorana.ch
        env:
          SSH_KEY:   ${{ secrets.DIST_SSH_KEY }}
          SSH_HOST:  ${{ secrets.DIST_SSH_HOST }}
          SSH_USER:  ${{ secrets.DIST_SSH_USER }}
          SSH_KNOWN: ${{ secrets.DIST_SSH_KNOWN_HOSTS }}
          DEST_ROOT: ${{ vars.DIST_DEST_ROOT }}
          TAG:       ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::warning::DIST_SSH_KEY/HOST/USER not set — artifacts were NOT published."
            echo "They remain downloadable as Actions artifacts on this run only."
            exit 0
          fi

          ROOT="${DEST_ROOT:-}/blog-toolkit"

          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/dist_key' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dist_key
          chmod 600 ~/.ssh/dist_key

          if [ -n "${SSH_KNOWN:-}" ]; then
            printf '%s\n' "$SSH_KNOWN" > ~/.ssh/known_hosts
          else
            echo "::warning::DIST_SSH_KNOWN_HOSTS unset — accepting the host key unverified."
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/dist_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          # Versioned copy first: if the latest/ sync then fails, the release
          # is still fetchable at its immutable URL.
          rsync -av --chmod=F644 -e "$SSH" release/ "$SSH_USER@$SSH_HOST:$ROOT/$TAG/"
          rsync -av --delete --chmod=F644 -e "$SSH" release/ "$SSH_USER@$SSH_HOST:$ROOT/latest/"

          echo "Published $TAG → $SSH_HOST:$ROOT/{$TAG,latest}/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag || github.ref_name }}"

          gh release create "$TAG" \
            --title "blog-toolkit $TAG" \
            --notes "$(cat <<'EOF'
          ## Installation

          ### macOS (Apple Silicon)
          ```bash
          curl -L https://mayorana.ch/downloads/blog-toolkit/${{ needs.prepare.outputs.tag || github.ref_name }}/blog-toolkit-macos-arm64.tar.gz | tar xz
          cd blog-toolkit-macos-arm64
          ./setup-mac.sh
          ./blog-toolkit
          ```

          ### Windows
          Download **blog-toolkit-setup.exe** and run it — the installer handles Node.js and WebView2.

          ### Linux (x86_64)
          ```bash
          curl -L https://mayorana.ch/downloads/blog-toolkit/${{ needs.prepare.outputs.tag || github.ref_name }}/blog-toolkit-linux-x86_64.tar.gz | tar xz
          cd blog-toolkit-linux-x86_64
          sudo ./setup-linux.sh
          ./blog-toolkit
          ```

          > **Runtime requirement (Linux):** `libwebkit2gtk-4.1` — installed automatically by `setup-linux.sh`.
          > **Node.js ≥18** is required on all platforms for post publishing (`generate-blog-data.js`).
          EOF
          )" \
            release/latest.json
