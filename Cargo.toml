[package]
name = "blog-toolkit"
version = "0.1.2"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
chrono = "0.4"
directories = "5.0"
rfd = "0.15"
pulldown-cmark = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"
